<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>v2 material look development</title>
    <style>
      :root {
        color-scheme: dark;
        background: rgb(1, 2, 1);
        color: #dce7e4;
        font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      aside {
        position: fixed;
        inset: 12px auto 12px 12px;
        width: min(350px, calc(100vw - 24px));
        overflow: auto;
        padding: 12px;
        border: 1px solid #42534d;
        border-radius: 8px;
        background: #07100ee8;
        backdrop-filter: blur(10px);
      }
      h1 { margin: 0 0 2px; font: 600 15px/1.2 system-ui, sans-serif; }
      p { margin: 0 0 10px; color: #9fb8b0; }
      #controls { display: grid; gap: 7px; }
      .number-control {
        display: grid;
        grid-template-columns: 110px 1fr 58px;
        gap: 7px;
        align-items: center;
      }
      .toggle-control, .colour-control {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }
      input[type="range"] { width: 100%; }
      input[type="color"] { width: 42px; height: 24px; padding: 1px; border: 1px solid #49635a; background: #10251f; }
      output { overflow: hidden; color: #b8d5cb; text-align: right; }
      .copy { display: flex; gap: 5px; align-items: center; }
      .help {
        width: 18px;
        height: 18px;
        border: 1px solid #51665f;
        border-radius: 50%;
        color: #a9c1b9;
        text-align: center;
        cursor: help;
      }
      #errors { margin-top: 10px; color: #ff9b8e; white-space: pre-wrap; }
      @media (max-width: 700px) {
        aside { bottom: auto; max-height: 52vh; }
      }
    </style>
  </head>
  <body>
    <canvas id="lookSurface" aria-label="Slime and gold material fixture"></canvas>
    <aside>
      <h1>Fixture material look</h1>
      <p id="status">Starting WebGPU…</p>
      <section id="controls" aria-label="Surface parameters"></section>
      <div id="errors" hidden></div>
    </aside>
    <script type="module" src="src/look.js"></script>
  </body>
</html>
