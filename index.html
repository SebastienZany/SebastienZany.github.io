<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>A Bestiary of Vanishings</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
    // The one build stamp. BUMP IT ON EVERY DEPLOY. Stylesheets and assets are
    // requested with it, so a new page is never paired with stale ones.
    window.__BUILD_VERSION = '2026-11-10-rewrite';
    for (const sheet of ['base', 'start-screen', 'story', 'panel']) {
      document.write(`<link rel="stylesheet" href="styles/${sheet}.css?v=${window.__BUILD_VERSION}">`);
    }
    // Diagnostics load first and separately, so they can report a page whose
    // game code never runs.
    document.write(`<script src="shell/diagnostics.js?v=${window.__BUILD_VERSION}"><\/script>`);
    </script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
        "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.8.3/build/index.module.js"
      }
    }
    </script>
  </head>
  <body>
    <main id="app" data-panel-visible="false">
      <canvas id="sim"></canvas>
      <div id="overlay"></div>
      <!-- start-screen:begin (owned by src/game/flow) -->
      <section id="startScreen" class="start-screen" aria-label="Start screen">
        <div class="start-screen-stage">
          <h1 id="startScreenTitle" class="start-screen-title">A Bestiary of Vanishings</h1>
          <p id="startScreenIntroLine" class="start-screen-intro-line" aria-label="what grows in the dark remembers everything">
            <span>what grows in the dark remembers everything</span><span class="start-screen-intro-dots" aria-hidden="true"><span class="start-screen-intro-dot">.</span><span class="start-screen-intro-dot">.</span><span class="start-screen-intro-dot">.</span></span>
          </p>
          <div class="start-screen-action">
            <p id="startScreenStatus" class="start-screen-status">loading...</p>
            <button id="startButton" class="start-button" type="button" hidden>begin</button>
          </div>
        </div>
      </section>
      <!-- start-screen:end -->
    </main>
    <script>document.write(`<script src="shell/boot.js?v=${window.__BUILD_VERSION}"><\/script>`);</script>
  </body>
</html>
